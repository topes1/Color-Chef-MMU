# Created by topes1
# Holds functions to manipulate the tool dict.

[include variables.cfg]
[save_variables]
filename: ~/printer_data/config/Color_Chef/saved_variables.cfg #might try to change this to a dynamic location 


######### Add this to print start!
# Auto-save before print starts
[gcode_macro PRINT_START]
gcode:
    SAVE_IF_DIRTY 


[gcode_macro PERSISTENT_TOOL_MANAGER]
variable_tools: {} # Dictionary with tool_id as key
variable_defined_tools: [] # Array of active tool IDs
variable_active_tool_id: -1
initialized: false
gcode:
    {% if not printer["gcode_macro PERSISTENT_TOOL_MANAGER"].initialized %}
        LOAD_HEADS_FROM_DISK
    {% endif %}


[gcode_macro ADD_TOOL]
gcode:
    {% set tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools %}
    {% set defined_tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].defined_tools %}
    {% set defaults = printer["gcode_macro DEFAULT_SETTINGS"] %}

    {% set tool_id = params.ID|string %}
    {% set temp = params.TEMP|default(defaults.default_temp)|int %}
    {% set material = params.MATERIAL|default(defaults.default_material)|string %}
    
    # Create tool data
    {% set tool_data = {
        'temp': temp,
        'material': material,
        'active': true
    } %}
    
    # Update tools dictionary
    {% set updated_tools = tools.copy() %}
    {% set _ = updated_tools.update({tool_id: tool_data}) %}
    
    # Update active tool array if not already present
    {% set updated_active = defined_tools %}
    {% if tool_id not in defined_tools %}
        {% set updated_active = defined_tools + [tool_id] %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=tools VALUE="{updated_tools|string}"
    SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=defined_tools VALUE="{updated_active|string}"
    SET_GCODE_VARIABLE MACRO=TOOL_MANAGER_SAVER VARIABLE=dirty VALUE=True
    SAVE_TOOLS_TO_DISK
    RESPOND MSG="Tool {tool_id} added"

[gcode_macro REMOVE_TOOL]
gcode:
    {% set tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools %}
    {% set defined_tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].defined_tools %}
    {% set active_tool_id = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].active_tool_id %}
    {% set tool_id = params.ID|string %}

    {% if active_tool_id != tool_id %}
        {% if tool_id in tools %}
            # Remove from dictionary
            {% set updated_tools = tools.copy() %}
            {% set _ = updated_tools.pop(tool_id) %}
            
            # Remove from active array
            {% set updated_active = [] %}
            {% for id in defined_tools %}
                {% if id != tool_id %}
                    {% set updated_active = updated_active + [id] %}
                {% endif %}
                {% endfor %}
            SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=tools VALUE="{updated_tools|string}"
            SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=defined_tools VALUE="{updated_active|string}"
            RESPOND MSG="Tool {tool_id} removed"
            SAVE_TOOLS_TO_DISK
        {% else %}
            RESPOND MSG="Tool {tool_id} not found"
        {% endif %}
    {% else%}
        RESPOND MSG="Can't remove active tool!"
    {% endif %}


[gcode_macro CREATE_INITIAL_TOOLS] #To create multiple tools at once, like the first time running this.
variable_counter: 0
gcode:
    {% set defaults = printer["gcode_macro DEFAULT_SETTINGS"] %}
    {% set count = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools|length %}
    {% set max = default(defaults.max_tools)|int %}
    {% set counter = printer["gcode_macro COUNTER_MACRO"].counter %}


    {% if count < max %}
        {% for i in range(count, max) %}
            ADD_TOOL ID="tool_{i}"
            {% set new_value = counter + 1 %}
            SET_GCODE_VARIABLE MACRO=COUNTER_MACRO VARIABLE=counter VALUE={new_value}
        {% endfor %}
    {% endif %}
    RESPOND MSG="Created {counter} tools"
    SAVE_TOOLS_TO_DISK


[gcode_macro LIST_TOOLS]
gcode:
    {% set tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools %}
    {% set defined_tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].defined_tools %}
    {% set active_tool_id = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].active_tool_id %}
    
    RESPOND MSG="=== TOOL STATUS ==="
    {% for tool_id in defined_tools %}
        {% set tool = tools[tool_id] %}
        RESPOND MSG="Tool {tool_id}: Temp={tool.temp}°C, Material={tool.material}"
    {% endfor %}

    RESPOND MSG="Active tool = {active_tool_id} ID: Temp = {tools[active_tool_id].temp}°C, Material={tools[active_tool_id].material}"
    RESPOND MSG="Total defined tools: {defined_tools|length}"



[gcode_macro RESIZE_TOOL_ARRAY]
gcode:
    {% set target_size = params.SIZE|int %}
    {% set tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools %}
    {% set defined_tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].defined_tools %}
    {% set active_tool_id = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].active_tool_id %}

    {% set current_size = defined_tools|length %}
    {% set defaults = printer["gcode_macro DEFAULT_SETTINGS"] %}

    {% if target_size > current_size %}
        # Add tools
        {% for i in range(current_size, target_size) %}
            ADD_TOOL ID="tool_{i}" TEMP=defaults.default_temp
        {% endfor %}
        RESPOND MSG="Expanded array to {target_size} tools"
    {% elif target_size < current_size %}
        # Remove tools
        {% for i in range(target_size, current_size) %}
            {% if i != active_tool_id %}
                REMOVE_TOOL ID="tool_{i}"
            {% endif %}
        {% endfor %}
        RESPOND MSG="Shrunk array to {target_size} tools"
        SET_GCODE_VARIABLE MACRO=TOOL_MANAGER_SAVER VARIABLE=dirty VALUE=True
    {% else %}
        RESPOND MSG="Array already has {target_size} tools"
    {% endif %}
    SAVE_IF_DIRTY



[gcode_macro SAVE_IF_DIRTY]
gcode:
    {% set manager = printer["gcode_macro PERSISTENT_TOOL_MANAGER"] %}
    {% if manager.dirty %}
        SAVE_TOOLS_TO_DISK
        SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=dirty VALUE=False
        RESPOND MSG="Changes saved to disk"
    {% else %}
        RESPOND MSG="No changes to save"
    {% endif %}


[gcode_macro SAVE_TOOLS_TO_DISK]
gcode:
    {% set tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].tools %}
    {% set defined_tools = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].defined_tools %}
    {% set active_tool = printer["gcode_macro PERSISTENT_TOOL_MANAGER"].active_tool_id %}
    
    # Save to persistent storage
    SAVE_VARIABLE VARIABLE=persistent_tools VALUE="{tools|string}"
    SAVE_VARIABLE VARIABLE=persistent_defined_tools VALUE="{defined_tools|string}"
    SAVE_VARIABLE VARIABLE=persistent_active_tool VALUE="{active_tool|string}"

    RESPOND MSG="Tools saved to disk"




[gcode_macro LOAD_TOOLS_FROM_DISK]
gcode:
    {% set saved_vars = printer.save_variables.variables %}
    
    # Load from disk if available
    {% if 'persistent_tools' in saved_vars %}
        {% set saved_tools = saved_vars.persistent_tools %}
        SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=tools VALUE="{saved_tools}"
        RESPOND MSG="Tools loaded from disk"
    {% endif %}
    
    {% if 'persistent_defined_tools' in saved_vars %}
        {% set saved_defined = saved_vars.persistent_defined_tools %}
        SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=defined_tools VALUE="{saved_defined}"
    {% endif %}

    {% if 'persistent_active_tool' in saved_vars %}
        {% set saved_active = saved_vars.persistent_active_tool %}
        SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=active_tool VALUE="{saved_active}"
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=PERSISTENT_TOOL_MANAGER VARIABLE=initialized VALUE=True